[project]
name = "awaz-agent"
version = "0.1.0"
description = "Awaz demo: a Dari-speaking voice agent that takes restaurant orders"
requires-python = ">=3.11"
dependencies = [
    "pipecat-ai[google,runner,silero,webrtc]==1.12.0",
    "httpx>=0.27,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Tool descriptions the LLM reads come from these docstrings; keep each on one line.
"handlers.py" = ["E501"]
